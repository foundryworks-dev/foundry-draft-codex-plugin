name: release

# Package the Codex plugin into a versioned tarball and publish it +
# SHA256SUMS + latest.txt to the public Cloudflare R2 bucket behind
# dl.foundryworks.dev, under codex-plugin/<version>/. The remote installer
# (foundryworks.dev/install-codex.sh, #419) downloads + SHA-256-verifies these.
# Triggered by pushing a version tag, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
#
# Same infra + secrets as the `foundry` CLI release (#370): R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID, R2_BUCKET. This is a pure-Node plugin, so
# there's nothing to compile — we just archive the runtime files.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: publish to R2
    runs-on: ubuntu-latest
    # Environment protection (optional): attach the R2 secrets to a `release`
    # environment and uncomment to gate this job behind it.
    # environment: release
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      # Kept as its own variable as well as interpolated into R2_ENDPOINT so
      # the preflight below can tell you *which* secret is missing. Interpolated
      # alone, an unset account id just yields "https://.r2.cloudflarestorage.com".
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4

      # Fail here, by name, rather than 40 lines later inside the AWS CLI.
      #
      # An unset secret interpolates to an empty string, so the job used to run
      # all the way to `aws s3 cp` and die with:
      #
      #   Publishing codex-plugin main to s3:///codex-plugin/main
      #   aws: [ERROR]: Invalid endpoint: https://.r2.cloudflarestorage.com
      #
      # Both blanks are right there in the output and neither is named. That is
      # the whole bug (#517): the secrets had never been added to this repo —
      # they live on the `foundry` CLI repo, which this workflow was adapted
      # from — and nothing said so.
      - name: Preflight — required secrets and ref
        run: |
          missing=()
          [ -n "${R2_BUCKET}" ]            || missing+=("R2_BUCKET")
          [ -n "${R2_ACCOUNT_ID}" ]        || missing+=("R2_ACCOUNT_ID")
          [ -n "${AWS_ACCESS_KEY_ID}" ]    || missing+=("R2_ACCESS_KEY_ID")
          [ -n "${AWS_SECRET_ACCESS_KEY}" ] || missing+=("R2_SECRET_ACCESS_KEY")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}. Add them under" \
                 "Settings → Secrets and variables → Actions. They are the same" \
                 "four the foundry CLI release uses."
            exit 1
          fi

          # GITHUB_REF_NAME is the branch name when this is dispatched from a
          # branch, so the failing run published to codex-plugin/main/ — "main"
          # as a version. Dispatching against a *tag* still works, which is the
          # case worth keeping: re-running a publish for an existing release.
          case "${GITHUB_REF_NAME}" in
            v*) ;;
            *)
              echo "::error::Refusing to publish '${GITHUB_REF_NAME}' as a version." \
                   "Push a tag (git tag v0.1.0 && git push origin v0.1.0), or" \
                   "dispatch this workflow against an existing tag."
              exit 1
              ;;
          esac

          echo "Publishing ${GITHUB_REF_NAME} to bucket ${R2_BUCKET}"

      - name: Package tarball
        run: |
          mkdir -p dist
          # Archive only the runtime files the installer wires up. Paths land
          # at the tarball root, so extraction yields mcp/, skills/, scripts/.
          tar -czf "dist/foundry-draft-codex-plugin.tar.gz" \
            mcp skills scripts AGENTS.snippet.md README.md LICENSE
          # The installer errors out if skills/ is absent, but a tarball that
          # silently shipped without it would still publish. Fail here instead.
          tar -tzf "dist/foundry-draft-codex-plugin.tar.gz" \
            | grep -q '^skills/foundry-watch/SKILL.md$' \
            || { echo "::error::tarball is missing skills/ — packaging is wrong"; exit 1; }
          ls -l dist

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum foundry-draft-codex-plugin.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release to R2
        working-directory: dist
        run: |
          version="${GITHUB_REF_NAME}"
          dest="s3://${R2_BUCKET}/codex-plugin/${version}"
          echo "Publishing codex-plugin ${version} to ${dest}"
          aws s3 cp foundry-draft-codex-plugin.tar.gz "${dest}/foundry-draft-codex-plugin.tar.gz" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type application/gzip
          aws s3 cp SHA256SUMS "${dest}/SHA256SUMS" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type text/plain

      - name: Update latest pointer
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          printf '%s\n' "${GITHUB_REF_NAME}" > latest.txt
          aws s3 cp latest.txt "s3://${R2_BUCKET}/codex-plugin/latest.txt" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type text/plain \
            --cache-control 'no-cache'
