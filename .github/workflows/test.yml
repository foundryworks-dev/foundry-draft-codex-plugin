name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  install-orderings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Both installers write the same config.toml block from different
      # places. #520 and #534 were both "one ordering was never run", so
      # the orderings are what CI runs.
      - run: ./scripts/test-install.sh
