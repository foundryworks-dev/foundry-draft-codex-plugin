name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  install-orderings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Both installers write the same config.toml block from different
      # places. #520 and #534 were both "one ordering was never run", so
      # the orderings are what CI runs.
      - run: ./scripts/test-install.sh

  model-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # #554: the model resolver read Claude Code's field shape out of
      # Codex's rollouts, so it returned nothing and the header was
      # silently omitted. Omitting is also the correct behaviour when the
      # model is genuinely unknown, so nothing distinguished broken from
      # idle — which is how the same implementation shipped to two hosts
      # reporting nothing on both. CI runs the resolver now.
      - run: ./scripts/test-model.sh

  craft-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # #666: craft_call must hand screenshots to the client as MCP image
      # content. Stringifying them would still look like it works, so the
      # content type is asserted, over the real stdio transport.
      - run: node scripts/test-craft-tools.js
